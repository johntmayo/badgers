<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>SNL S52 Ranker</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=IBM+Plex+Mono:wght@400;500;600;700&family=Saira+Condensed:wght@400;500;600;700;800&display=swap" rel="stylesheet">
<style>
:root {
  --bg: #101211;
  --panel: #171a18;
  --panel-2: #1d211f;
  --line: #2a302c;
  --line-strong: #3a433e;
  --ink: #e8ece9;
  --mute: #7a8680;
  --faint: #4a544e;
  --accent: #c6ff40;
  --update: #3eb6ff;
  --update-bg: rgba(62,182,255,0.08);
  --fav: #ff6b9d;
  --a: #b8ff3c;
  --b: #7dd3fc;
  --c: #fbbf24;
  --d: #fb923c;
  --f: #f87171;
  --sidebar-w: 220px;
  --row-h: 34px;
}
* { box-sizing: border-box; margin: 0; padding: 0; }
html, body { height: 100%; }
body {
  font-family: 'Saira Condensed', sans-serif;
  background: var(--bg);
  color: var(--ink);
  font-size: 15px;
  line-height: 1.25;
  -webkit-font-smoothing: antialiased;
}
button, input, select, textarea { font: inherit; color: inherit; }
.app { display: flex; height: 100vh; overflow: hidden; }

.sidebar {
  width: var(--sidebar-w);
  flex-shrink: 0;
  background: #0c0e0d;
  border-right: 1px solid var(--line);
  display: flex;
  flex-direction: column;
  overflow: hidden;
}
.brand { padding: 12px 12px 10px; border-bottom: 1px solid var(--line); }
.brand-kicker {
  font-family: 'IBM Plex Mono', monospace;
  font-size: 9px;
  font-weight: 600;
  letter-spacing: 0.14em;
  text-transform: uppercase;
  color: var(--faint);
}
.brand-title { font-size: 22px; font-weight: 800; letter-spacing: 0.01em; line-height: 1; margin-top: 2px; }
.brand-title span { color: var(--a); }
.brand-sub { font-family: 'IBM Plex Mono', monospace; font-size: 10px; color: var(--mute); margin-top: 4px; }
.ep-list { flex: 1; overflow-y: auto; }
.ep-item {
  display: grid;
  grid-template-columns: 52px 1fr;
  gap: 0 8px;
  padding: 8px 10px;
  border-bottom: 1px solid #151816;
  cursor: pointer;
  align-items: baseline;
}
.ep-item:hover { background: #141716; }
.ep-item.active { background: var(--panel); box-shadow: inset 3px 0 0 var(--a); }
.ep-code {
  font-family: 'IBM Plex Mono', monospace;
  font-size: 10px;
  font-weight: 600;
  color: var(--faint);
}
.ep-item.active .ep-code { color: var(--a); }
.ep-host { font-size: 14px; font-weight: 700; line-height: 1.1; }
.ep-meta {
  grid-column: 2;
  font-family: 'IBM Plex Mono', monospace;
  font-size: 10px;
  color: var(--mute);
  margin-top: 2px;
  display: flex;
  gap: 6px;
  flex-wrap: wrap;
}
.ep-meta .done { color: var(--a); }

.main { flex: 1; min-width: 0; display: flex; flex-direction: column; overflow: hidden; }
.topbar {
  display: flex;
  align-items: flex-end;
  justify-content: space-between;
  gap: 12px;
  padding: 10px 14px 8px;
  border-bottom: 1px solid var(--line);
  background: var(--panel);
  flex-shrink: 0;
}
.top-left { min-width: 0; }
.top-host { font-size: 26px; font-weight: 800; letter-spacing: -0.01em; line-height: 1; }
.top-line {
  font-family: 'IBM Plex Mono', monospace;
  font-size: 11px;
  color: var(--mute);
  margin-top: 4px;
  white-space: nowrap;
  overflow: hidden;
  text-overflow: ellipsis;
}
.top-right { display: flex; flex-direction: column; align-items: flex-end; gap: 6px; flex-shrink: 0; }
.mode-tabs, .sort-row { display: flex; gap: 3px; align-items: center; }
.tab, .sort-btn {
  font-family: 'IBM Plex Mono', monospace;
  font-size: 10px;
  font-weight: 600;
  letter-spacing: 0.04em;
  text-transform: uppercase;
  padding: 5px 9px;
  border: 1px solid var(--line-strong);
  background: transparent;
  color: var(--mute);
  cursor: pointer;
  border-radius: 2px;
}
.tab:hover, .sort-btn:hover { color: var(--ink); border-color: var(--mute); }
.tab.active, .sort-btn.active { background: var(--ink); color: #0c0e0d; border-color: var(--ink); }
.sort-label {
  font-family: 'IBM Plex Mono', monospace;
  font-size: 9px;
  color: var(--faint);
  letter-spacing: 0.08em;
  text-transform: uppercase;
  margin-right: 4px;
}
.content { flex: 1; overflow: hidden; display: flex; flex-direction: column; }

.list-wrap { flex: 1; overflow-y: auto; }
.list-head, .list-row {
  display: grid;
  grid-template-columns: 28px 52px minmax(120px,1.4fr) 70px minmax(100px,1fr) minmax(80px,0.8fr) 28px;
  gap: 8px;
  align-items: center;
  padding: 0 14px;
  border-bottom: 1px solid var(--line);
}
.list-head {
  position: sticky;
  top: 0;
  z-index: 2;
  background: var(--bg);
  height: 26px;
  font-family: 'IBM Plex Mono', monospace;
  font-size: 9px;
  font-weight: 600;
  letter-spacing: 0.1em;
  text-transform: uppercase;
  color: var(--faint);
}
.list-row {
  min-height: var(--row-h);
  padding-top: 5px;
  padding-bottom: 5px;
  background: var(--panel);
  cursor: pointer;
}
.list-row:nth-child(even) { background: var(--panel-2); }
.list-row:hover { filter: brightness(1.06); }
.list-row.is-update { background: var(--update-bg); box-shadow: inset 3px 0 0 var(--update); }
.list-row.is-update:nth-child(even) { background: rgba(62,182,255,0.12); }
.list-row.sel { outline: 1px solid var(--accent); outline-offset: -1px; }
.col-n { font-family: 'IBM Plex Mono', monospace; font-size: 11px; color: var(--faint); text-align: right; }
.col-title { font-size: 15px; font-weight: 700; min-width: 0; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
.col-cat {
  font-family: 'IBM Plex Mono', monospace;
  font-size: 9px;
  font-weight: 600;
  letter-spacing: 0.06em;
  text-transform: uppercase;
  color: var(--mute);
}
.list-row.is-update .col-cat { color: var(--update); }
.col-cast, .col-notes-preview {
  font-size: 12px;
  color: var(--mute);
  white-space: nowrap;
  overflow: hidden;
  text-overflow: ellipsis;
  min-width: 0;
}
.grade-select, .cat-select-sm {
  font-family: 'IBM Plex Mono', monospace;
  font-size: 12px;
  font-weight: 700;
  background: #0c0e0d;
  border: 1px solid var(--line-strong);
  border-radius: 2px;
  padding: 2px 4px;
  width: 100%;
  cursor: pointer;
}
.fav-toggle { background: none; border: none; cursor: pointer; color: var(--faint); font-size: 14px; line-height: 1; padding: 0; }
.fav-toggle.on { color: var(--fav); }

.detail-bar {
  border-top: 1px solid var(--line);
  background: #0c0e0d;
  padding: 8px 14px 10px;
  flex-shrink: 0;
}
.detail-title { font-size: 16px; font-weight: 800; }
.detail-summary { font-size: 12px; color: var(--mute); margin-top: 4px; line-height: 1.4; max-width: 90ch; }
.detail-fields {
  display: grid;
  grid-template-columns: 1fr 1fr auto;
  gap: 8px;
  margin-top: 8px;
  align-items: end;
}
.field label {
  display: block;
  font-family: 'IBM Plex Mono', monospace;
  font-size: 9px;
  letter-spacing: 0.1em;
  text-transform: uppercase;
  color: var(--faint);
  margin-bottom: 3px;
}
.field input, .field textarea {
  width: 100%;
  background: var(--panel);
  border: 1px solid var(--line-strong);
  border-radius: 2px;
  padding: 5px 7px;
  font-size: 13px;
}
.field textarea { min-height: 52px; resize: vertical; }
.btn-ghost {
  font-family: 'IBM Plex Mono', monospace;
  font-size: 10px;
  font-weight: 600;
  letter-spacing: 0.06em;
  text-transform: uppercase;
  padding: 7px 10px;
  border: 1px solid var(--line-strong);
  background: transparent;
  color: var(--mute);
  cursor: pointer;
  border-radius: 2px;
}
.btn-ghost:hover { color: var(--f); border-color: var(--f); }
.btn-ghost.primary { color: var(--ink); border-color: var(--ink); }
.btn-ghost.primary:hover { background: var(--ink); color: #0c0e0d; }
.add-strip {
  padding: 6px 14px;
  border-top: 1px solid var(--line);
  background: var(--panel);
  flex-shrink: 0;
}
.add-strip button.linkish {
  background: none;
  border: none;
  color: var(--mute);
  cursor: pointer;
  font-family: 'IBM Plex Mono', monospace;
  font-size: 11px;
  letter-spacing: 0.04em;
}
.add-strip button.linkish:hover { color: var(--a); }

.card-stage {
  flex: 1;
  display: flex;
  flex-direction: column;
  min-height: 0;
  overflow: hidden;
  touch-action: pan-y;
  user-select: none;
}
.card-progress {
  font-family: 'IBM Plex Mono', monospace;
  font-size: 11px;
  color: var(--mute);
  padding: 8px 14px 0;
  display: flex;
  justify-content: space-between;
  align-items: center;
}
.card-progress .bar {
  flex: 1;
  height: 3px;
  background: var(--line);
  margin: 0 12px;
  border-radius: 1px;
  overflow: hidden;
}
.card-progress .bar > i { display: block; height: 100%; background: var(--a); width: 0%; }
.card-frame {
  flex: 1;
  display: flex;
  align-items: stretch;
  justify-content: center;
  padding: 12px 14px 8px;
  min-height: 0;
}
.sketch-card {
  width: min(560px, 100%);
  background: var(--panel);
  border: 1px solid var(--line-strong);
  border-radius: 3px;
  padding: 18px 18px 14px;
  display: flex;
  flex-direction: column;
  gap: 10px;
  transition: transform 0.18s ease, opacity 0.18s ease;
}
.sketch-card.is-update {
  border-color: var(--update);
  box-shadow: inset 4px 0 0 var(--update);
  background: linear-gradient(90deg, rgba(62,182,255,0.1), var(--panel) 28%);
}
.sketch-card.swipe-left { transform: translateX(-28px); opacity: 0.55; }
.sketch-card.swipe-right { transform: translateX(28px); opacity: 0.55; }
.card-cat {
  font-family: 'IBM Plex Mono', monospace;
  font-size: 10px;
  font-weight: 600;
  letter-spacing: 0.12em;
  text-transform: uppercase;
  color: var(--mute);
}
.sketch-card.is-update .card-cat { color: var(--update); }
.card-title { font-size: 28px; font-weight: 800; letter-spacing: -0.015em; line-height: 1.05; }
.card-summary { font-size: 13px; color: var(--mute); line-height: 1.45; flex: 1; overflow-y: auto; }
.card-cast { font-family: 'IBM Plex Mono', monospace; font-size: 11px; color: var(--faint); line-height: 1.35; }
.grade-pad { display: grid; grid-template-columns: repeat(7, 1fr); gap: 4px; }
.grade-btn {
  font-family: 'IBM Plex Mono', monospace;
  font-size: 12px;
  font-weight: 700;
  padding: 9px 0;
  border: 1px solid var(--line-strong);
  background: #0c0e0d;
  color: var(--mute);
  cursor: pointer;
  border-radius: 2px;
}
.grade-btn:hover { border-color: var(--mute); color: var(--ink); }
.grade-btn.on { color: #0c0e0d; border-color: transparent; }
.card-actions { display: flex; justify-content: space-between; align-items: center; gap: 8px; margin-top: 2px; }
.card-nav { display: flex; gap: 6px; padding: 0 14px 12px; justify-content: center; }
.nav-btn {
  font-family: 'IBM Plex Mono', monospace;
  font-size: 11px;
  font-weight: 600;
  letter-spacing: 0.06em;
  text-transform: uppercase;
  padding: 8px 16px;
  border: 1px solid var(--line-strong);
  background: var(--panel);
  color: var(--ink);
  cursor: pointer;
  border-radius: 2px;
  min-width: 110px;
}
.nav-btn:disabled { opacity: 0.35; cursor: default; }
.nav-btn:not(:disabled):hover { border-color: var(--a); color: var(--a); }
.hint {
  font-family: 'IBM Plex Mono', monospace;
  font-size: 10px;
  color: var(--faint);
  text-align: center;
  padding-bottom: 8px;
}

.ranked-wrap { flex: 1; overflow-y: auto; padding: 0; }
.rank-row {
  display: grid;
  grid-template-columns: 36px 48px 1fr auto;
  gap: 10px;
  align-items: center;
  padding: 7px 14px;
  border-bottom: 1px solid var(--line);
  background: var(--panel);
}
.rank-row:nth-child(even) { background: var(--panel-2); }
.rank-row.is-update { box-shadow: inset 3px 0 0 var(--update); }
.rank-n { font-family: 'IBM Plex Mono', monospace; font-size: 13px; font-weight: 700; color: var(--faint); text-align: right; }
.rank-n.top { color: var(--a); }
.rank-grade { font-family: 'IBM Plex Mono', monospace; font-size: 18px; font-weight: 700; }
.rank-title { font-size: 15px; font-weight: 700; }
.rank-sub { font-family: 'IBM Plex Mono', monospace; font-size: 10px; color: var(--mute); margin-top: 1px; }
.rank-right { text-align: right; }
.rank-fav { color: var(--fav); font-size: 12px; }

.empty {
  padding: 48px 20px;
  text-align: center;
  color: var(--mute);
  font-family: 'IBM Plex Mono', monospace;
  font-size: 12px;
}
.empty strong {
  display: block;
  color: var(--ink);
  font-family: 'Saira Condensed', sans-serif;
  font-size: 20px;
  margin-bottom: 6px;
}

.g-ap, .g-a, .g-am { color: var(--a); }
.g-bp, .g-b, .g-bm { color: var(--b); }
.g-cp, .g-c, .g-cm { color: var(--c); }
.g-dp, .g-d, .g-dm { color: var(--d); }
.g-f { color: var(--f); }
.g-none { color: var(--faint); }
.grade-btn.on.g-ap, .grade-btn.on.g-a, .grade-btn.on.g-am { background: var(--a); }
.grade-btn.on.g-bp, .grade-btn.on.g-b, .grade-btn.on.g-bm { background: var(--b); }
.grade-btn.on.g-cp, .grade-btn.on.g-c, .grade-btn.on.g-cm { background: var(--c); }
.grade-btn.on.g-dp, .grade-btn.on.g-d, .grade-btn.on.g-dm { background: var(--d); }
.grade-btn.on.g-f { background: var(--f); }

::-webkit-scrollbar { width: 6px; height: 6px; }
::-webkit-scrollbar-thumb { background: #333a36; border-radius: 2px; }
::-webkit-scrollbar-track { background: transparent; }

@media (max-width: 820px) {
  .sidebar { width: 160px; }
  .list-head, .list-row { grid-template-columns: 22px 48px minmax(80px,1fr) 56px 28px; }
  .col-cast, .col-notes-preview, .list-head span:nth-child(5), .list-head span:nth-child(6) { display: none; }
  .top-host { font-size: 20px; }
  .card-title { font-size: 22px; }
  .grade-pad { grid-template-columns: repeat(4, 1fr); }
}
</style>
</head>
<body>
<div class="app">
  <aside class="sidebar">
    <div class="brand">
      <div class="brand-kicker">Saturday Night Live</div>
      <div class="brand-title">S52 <span>Ranker</span></div>
      <div class="brand-sub">2026–27 · letter grades</div>
    </div>
    <div class="ep-list" id="ep-list"></div>
  </aside>
  <main class="main">
    <header class="topbar">
      <div class="top-left">
        <div class="top-host" id="main-title">Select episode</div>
        <div class="top-line" id="main-sub"></div>
      </div>
      <div class="top-right">
        <div class="mode-tabs">
          <button class="tab active" data-view="list" onclick="setView('list')">List</button>
          <button class="tab" data-view="cards" onclick="setView('cards')">Cards</button>
          <button class="tab" data-view="ranked" onclick="setView('ranked')">Best Of</button>
        </div>
        <div class="sort-row" id="sort-row">
          <span class="sort-label">Sort</span>
          <button class="sort-btn active" data-sort="air" onclick="setSort('air')">Air</button>
          <button class="sort-btn" data-sort="grade-desc" onclick="setSort('grade-desc')">Grade ↓</button>
          <button class="sort-btn" data-sort="grade-asc" onclick="setSort('grade-asc')">Grade ↑</button>
        </div>
      </div>
    </header>
    <div class="content" id="content"></div>
  </main>
</div>

  'C+':'g-cp','C':'g-c','C-':'g-cm',
  'D+':'g-dp','D':'g-d','D-':'g-dm',
  'F':'g-f'

function isRatable(s) { return !SKIP_RE.test(s.title || ''); }
function ratableSketches(ep) { return (ep.sketches || []).filter(isRatable); }
function gradeClass(g) { return g ? (GRADE_CLASS[g] || 'g-none') : 'g-none'; }
function esc(s) {
  return (s || '').replace(/&/g,'&amp;').replace(/</g,'&lt;').replace(/>/g,'&gt;').replace(/"/g,'&quot;');
}
function normalizeSketch(s) {
  let rating = s.rating;
  if (typeof rating === 'number' || rating == null) rating = '';
  return { ...s, rating: String(rating), fav: !!s.fav, notes: s.notes || '', cast: s.cast || '', summary: s.summary || '' };
}

let episodes = JSON.parse(JSON.stringify(BASE_EPISODES)).map(ep => ({
  ...ep,
  sketches: (ep.sketches || []).filter(isRatable).map(normalizeSketch)
}));
let activeEpId = 'ep1';
let currentView = 'list';
let listSort = 'air';
let selectedId = null;
let cardIndex = 0;
let showAddForm = false;
let touchStartX = 0;
let touchDeltaX = 0;

function loadData() {
  try {
    const raw = localStorage.getItem('snl52_v2') || localStorage.getItem('snl52_v1');
    if (!raw) return;
    episodes = JSON.parse(raw).map(ep => ({
      ...ep,
      sketches: (ep.sketches || []).filter(isRatable).map(normalizeSketch)
    }));
  } catch (e) {}
}
function saveData() {
  try { localStorage.setItem('snl52_v2', JSON.stringify(episodes)); } catch (e) {}
}
function getEp() { return episodes.find(e => e.id === activeEpId); }
function getSketch(ep, id) { return ep.sketches.find(s => s.id === id); }

function sortedSketches(ep) {
  const list = [...ratableSketches(ep)];
  if (listSort === 'air') return list;
  list.sort((a, b) => {
    const ra = GRADE_RANK[a.rating] || 0;
    const rb = GRADE_RANK[b.rating] || 0;
    if (listSort === 'grade-desc') return (rb - ra) || a.title.localeCompare(b.title);
    return (ra - rb) || a.title.localeCompare(b.title);
  });
  return list;
}

function setView(v) {
  currentView = v;
  document.querySelectorAll('.tab').forEach(t => t.classList.toggle('active', t.dataset.view === v));
  document.getElementById('sort-row').style.display = v === 'list' ? 'flex' : 'none';
  if (v === 'cards') {
    const list = ratableSketches(getEp() || { sketches: [] });
    if (selectedId) {
      const i = list.findIndex(s => s.id === selectedId);
      cardIndex = i >= 0 ? i : 0;
    } else cardIndex = 0;
  }
  render();
}
function setSort(s) {
  listSort = s;
  document.querySelectorAll('.sort-btn').forEach(b => b.classList.toggle('active', b.dataset.sort === s));
  render();
}
function selectEp(id) {
  activeEpId = id;
  selectedId = null;
  cardIndex = 0;
  showAddForm = false;
  if (currentView === 'ranked') currentView = 'list';
  document.querySelectorAll('.tab').forEach(t => t.classList.toggle('active', t.dataset.view === currentView));
  document.getElementById('sort-row').style.display = currentView === 'list' ? 'flex' : 'none';
  render();
}

function renderSidebar() {
  document.getElementById('ep-list').innerHTML = episodes.map(ep => {
    const sk = ratableSketches(ep);
    const graded = sk.filter(s => s.rating).length;
    const favs = sk.filter(s => s.fav).length;
    const stats = sk.length
      ? `<span class="${graded === sk.length ? 'done' : ''}">${graded}/${sk.length}</span>${favs ? `<span>♥${favs}</span>` : ''}`
      : `<span>—</span>`;
    return `<div class="ep-item ${ep.id === activeEpId ? 'active' : ''}" onclick="selectEp('${ep.id}')">
      <div class="ep-code">${esc(ep.ep.split(' ')[0])}</div>
      <div>
        <div class="ep-host">${esc(ep.host)}</div>
        <div class="ep-meta"><span>${esc(ep.date)}</span>${stats}</div>
      </div>
    </div>`;
  }).join('');
}

function gradeOptions(selected) {
  return `<option value="">—</option>` + GRADES.map(g =>
    `<option value="${g}" ${selected === g ? 'selected' : ''}>${g}</option>`
  ).join('');
}

function addFormHtml(ep) {
  if (!showAddForm) return '';
  return `<div class="detail-bar" style="border-top:1px solid var(--line)">
    <div class="detail-fields" style="grid-template-columns:1fr 140px 1fr">
      <div class="field"><label>Title</label><input id="new-title" placeholder="Sketch title"></div>
      <div class="field"><label>Category</label><select id="new-cat">${Object.entries(CATS).map(([k,v])=>`<option value="${k}">${v}</option>`).join('')}</select></div>
      <div class="field"><label>Cast</label><input id="new-cast" placeholder="Cast…"></div>
    </div>
    <div class="field" style="margin-top:8px"><label>Summary</label><textarea id="new-summary"></textarea></div>
    <div style="display:flex;gap:6px;margin-top:8px">
      <button class="btn-ghost primary" onclick="addSketch('${ep.id}')">Save</button>
      <button class="btn-ghost" onclick="cancelAdd()">Cancel</button>
    </div>
  </div>`;
}

function renderList() {
  const ep = getEp();
  const content = document.getElementById('content');
  if (!ep) { content.innerHTML = '<div class="empty">Pick an episode</div>'; return; }
  document.getElementById('main-title').textContent = ep.host;
  document.getElementById('main-sub').textContent = `${ep.ep} · ${ep.date} · ${ep.musical}`;

  const list = sortedSketches(ep);
  if (!list.length) {
    content.innerHTML = `<div class="empty"><strong>No sketches yet</strong>Paste the wiki lineup into chat to load this episode.</div>
      <div class="add-strip"><button class="linkish" onclick="showAdd()">+ Add sketch manually</button></div>${addFormHtml(ep)}`;
    return;
  }

  const airOrder = ratableSketches(ep);
  const rows = list.map(s => {
    const airN = airOrder.findIndex(x => x.id === s.id) + 1;
    return `<div class="list-row ${s.cat === 'update' ? 'is-update' : ''} ${selectedId === s.id ? 'sel' : ''}" onclick="selectSketch('${s.id}')">
      <div class="col-n">${airN}</div>
      <div><select class="grade-select ${gradeClass(s.rating)}" onclick="event.stopPropagation()" onchange="setGradeFromSelect('${ep.id}','${s.id}',this.value)">${gradeOptions(s.rating)}</select></div>
      <div class="col-title" title="${esc(s.title)}">${esc(s.title)}</div>
      <div class="col-cat">${esc(CATS[s.cat] || s.cat)}</div>
      <div class="col-cast" title="${esc(s.cast)}">${esc(s.cast)}</div>
      <div class="col-notes-preview" title="${esc(s.notes)}">${esc(s.notes)}</div>
      <button class="fav-toggle ${s.fav ? 'on' : ''}" onclick="event.stopPropagation(); toggleFav('${ep.id}','${s.id}')" title="Favorite">♥</button>
    </div>`;
  }).join('');

  const sel = selectedId ? getSketch(ep, selectedId) : null;
  const detail = sel ? `<div class="detail-bar">
    <div class="detail-title">${esc(sel.title)}</div>
    <div class="detail-summary">${esc(sel.summary)}</div>
    <div class="detail-fields">
      <div class="field"><label>Cast</label><input value="${esc(sel.cast)}" onchange="updateField('${ep.id}','${sel.id}','cast',this.value)"></div>
      <div class="field"><label>Notes</label><input value="${esc(sel.notes)}" onchange="updateField('${ep.id}','${sel.id}','notes',this.value)"></div>
      <div class="field">
        <label>&nbsp;</label>
        <div style="display:flex;gap:6px">
          <button class="btn-ghost primary" onclick="setView('cards')">Grade in Cards</button>
          <button class="btn-ghost" onclick="deleteSketch('${ep.id}','${sel.id}')">Delete</button>
        </div>
      </div>
    </div>
  </div>` : `<div class="detail-bar"><div class="detail-summary" style="margin:0">Select a row for summary / cast / notes</div></div>`;

  content.innerHTML = `
    <div class="list-wrap">
      <div class="list-head"><span>#</span><span>Grade</span><span>Title</span><span>Type</span><span>Cast</span><span>Notes</span><span></span></div>
      ${rows}
    </div>
    ${detail}
    <div class="add-strip"><button class="linkish" onclick="showAdd()">+ Add sketch</button></div>
    ${addFormHtml(ep)}`;
}

function renderCards() {
  const ep = getEp();
  const content = document.getElementById('content');
  if (!ep) { content.innerHTML = '<div class="empty">Pick an episode</div>'; return; }
  document.getElementById('main-title').textContent = ep.host;
  document.getElementById('main-sub').textContent = `${ep.ep} · ${ep.date} · ${ep.musical}`;

  const list = ratableSketches(ep);
  if (!list.length) {
    content.innerHTML = `<div class="empty"><strong>No sketches yet</strong>Nothing to grade in card mode.</div>`;
    return;
  }
  cardIndex = Math.max(0, Math.min(list.length - 1, cardIndex));
  const s = list[cardIndex];
  selectedId = s.id;
  const pct = ((cardIndex + 1) / list.length) * 100;

  content.innerHTML = `<div class="card-stage" id="card-stage">
    <div class="card-progress">
      <span>${cardIndex + 1} / ${list.length}</span>
      <div class="bar"><i style="width:${pct}%"></i></div>
      <span class="${gradeClass(s.rating)}">${s.rating || 'UNGRADED'}</span>
    </div>
    <div class="card-frame">
      <div class="sketch-card ${s.cat === 'update' ? 'is-update' : ''}" id="active-card">
        <div class="card-cat">${esc(CATS[s.cat] || s.cat)}</div>
        <div class="card-title">${esc(s.title)}</div>
        <div class="card-summary">${esc(s.summary) || '<span style="color:var(--faint)">No summary</span>'}</div>
        <div class="card-cast">${esc(s.cast)}</div>
        <div class="grade-pad">
          ${GRADES.map(g => `<button type="button" class="grade-btn ${gradeClass(g)} ${s.rating === g ? 'on' : ''}" onclick="setGradeFromCard('${ep.id}','${s.id}','${g}')">${g}</button>`).join('')}
        </div>
        <div class="card-actions">
          <button type="button" class="fav-toggle ${s.fav ? 'on' : ''}" onclick="toggleFav('${ep.id}','${s.id}')" style="font-size:18px">♥ Favorite</button>
          <button type="button" class="btn-ghost" onclick="setGradeFromCard('${ep.id}','${s.id}','')">Clear grade</button>
        </div>
        <div class="field" style="margin-top:4px">
          <label>Notes</label>
          <input value="${esc(s.notes)}" onchange="updateField('${ep.id}','${s.id}','notes',this.value)" placeholder="Quick note…">
        </div>
      </div>
    </div>
    <div class="card-nav">
      <button type="button" class="nav-btn" onclick="cardStep(-1)" ${cardIndex === 0 ? 'disabled' : ''}>← Prev</button>
      <button type="button" class="nav-btn" onclick="cardStep(1)" ${cardIndex >= list.length - 1 ? 'disabled' : ''}>Next →</button>
    </div>
    <div class="hint">Swipe or ← → · tap a grade to set · advances automatically</div>
  </div>`;

  const stage = document.getElementById('card-stage');
  stage.addEventListener('touchstart', onTouchStart, { passive: true });
  stage.addEventListener('touchmove', onTouchMove, { passive: true });
  stage.addEventListener('touchend', onTouchEnd);
}

function renderRanked() {
  const content = document.getElementById('content');
  document.getElementById('main-title').textContent = 'Best of Season 52';
  document.getElementById('main-sub').textContent = 'Graded & favorited sketches · sorted by letter grade';

  const all = [];
  episodes.forEach(ep => ratableSketches(ep).forEach(s => {
    if (s.rating || s.fav) all.push({ ...s, epHost: ep.host, epDate: ep.date, epNum: ep.ep });
  }));
  all.sort((a, b) => {
    const d = (GRADE_RANK[b.rating] || 0) - (GRADE_RANK[a.rating] || 0);
    if (d) return d;
    if (a.fav !== b.fav) return a.fav ? -1 : 1;
    return a.title.localeCompare(b.title);
  });

  if (!all.length) {
    content.innerHTML = `<div class="empty"><strong>Nothing ranked yet</strong>Grade sketches in List or Cards — they show up here.</div>`;
    return;
  }

  content.innerHTML = `<div class="ranked-wrap">${all.map((s, i) => `
    <div class="rank-row ${s.cat === 'update' ? 'is-update' : ''}">
      <div class="rank-n ${i < 3 ? 'top' : ''}">${i + 1}</div>
      <div class="rank-grade ${gradeClass(s.rating)}">${esc(s.rating || '—')}</div>
      <div>
        <div class="rank-title">${esc(s.title)}</div>
        <div class="rank-sub">${esc(s.epNum)} · ${esc(s.epDate)} · ${esc(s.epHost)} · ${esc(CATS[s.cat] || s.cat)}</div>
      </div>
      <div class="rank-right">${s.fav ? '<div class="rank-fav">♥</div>' : ''}</div>
    </div>`).join('')}</div>`;
}

function render() {
  renderSidebar();
  if (currentView === 'ranked') renderRanked();
  else if (currentView === 'cards') renderCards();
  else renderList();
}

function selectSketch(id) { selectedId = id; renderList(); }

function setGradeFromSelect(epId, sId, grade) {
  const s = getSketch(episodes.find(e => e.id === epId), sId);
  if (!s) return;
  s.rating = grade;
  saveData();
  render();
}
function setGradeFromCard(epId, sId, grade) {
  const s = getSketch(episodes.find(e => e.id === epId), sId);
  if (!s) return;
  const clearing = !grade;
  const same = s.rating === grade;
  s.rating = same ? '' : grade;
  saveData();
  if (!clearing && !same) {
    const list = ratableSketches(getEp());
    if (cardIndex < list.length - 1) cardIndex += 1;
  }
  render();
}
function toggleFav(epId, sId) {
  const s = getSketch(episodes.find(e => e.id === epId), sId);
  s.fav = !s.fav;
  saveData();
  render();
}
function updateField(epId, sId, field, val) {
  const s = getSketch(episodes.find(e => e.id === epId), sId);
  s[field] = val;
  saveData();
  renderSidebar();
}
function deleteSketch(epId, sId) {
  if (!confirm('Remove this sketch?')) return;
  const ep = episodes.find(e => e.id === epId);
  ep.sketches = ep.sketches.filter(s => s.id !== sId);
  if (selectedId === sId) selectedId = null;
  saveData();
  render();
}
function showAdd() { showAddForm = true; renderList(); }
function cancelAdd() { showAddForm = false; renderList(); }
function addSketch(epId) {
  const title = (document.getElementById('new-title').value || '').trim();
  if (!title) { document.getElementById('new-title').focus(); return; }
  if (SKIP_RE.test(title)) {
    alert('That looks like a non-ratable segment (montage / bumper / goodnights). Not added.');
    return;
  }
  const ep = episodes.find(e => e.id === epId);
  ep.sketches.push({
    id: 'sk_' + Date.now(),
    title,
    cat: document.getElementById('new-cat').value,
    cast: document.getElementById('new-cast').value,
    notes: '',
    summary: document.getElementById('new-summary').value,
    rating: '',
    fav: false
  });
  showAddForm = false;
  saveData();
  render();
}

function cardStep(delta) {
  const list = ratableSketches(getEp());
  cardIndex = Math.max(0, Math.min(list.length - 1, cardIndex + delta));
  renderCards();
}
function onTouchStart(e) { touchStartX = e.changedTouches[0].screenX; touchDeltaX = 0; }
function onTouchMove(e) {
  touchDeltaX = e.changedTouches[0].screenX - touchStartX;
  const card = document.getElementById('active-card');
  if (!card) return;
  card.classList.toggle('swipe-right', touchDeltaX > 40);
  card.classList.toggle('swipe-left', touchDeltaX < -40);
}
function onTouchEnd() {
  if (touchDeltaX < -60) cardStep(1);
  else if (touchDeltaX > 60) cardStep(-1);
  else {
    const card = document.getElementById('active-card');
    if (card) card.classList.remove('swipe-left', 'swipe-right');
  }
  touchDeltaX = 0;
}

document.addEventListener('keydown', e => {
  if (currentView !== 'cards') return;
  if (e.target.matches('input, textarea, select')) return;
  if (e.key === 'ArrowRight' || e.key === 'j') { e.preventDefault(); cardStep(1); }
  if (e.key === 'ArrowLeft' || e.key === 'k') { e.preventDefault(); cardStep(-1); }
});

loadData();
document.getElementById('sort-row').style.display = 'flex';
render();
</script>
</body>
</html>
